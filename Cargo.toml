[package]
name = "rustproxy"
version = "2.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
hyper-tungstenite = "0.9"
http-body-util = "0.1"
bytes = "1.0"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }
chrono = "0.4"
dashmap = "5.5"
socket2 = { version = "0.6.0", features = ["all"] }
rand = "0.8"
rlimit = "0.10"
shadowsocks = { version = "1.24", features = ["aead-cipher-2022"] }
uuid = { version = "1", features = ["v5"] }
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1.3"
cfb-mode = "0.8"
fnv = "1.0"
sha3 = "0.10"
hickory-resolver = { version = "0.24", features = ["dns-over-https-rustls", "dns-over-rustls", "webpki-roots"] }
once_cell = "1.19"
tower-service = "0.3"
# TLS interception (--mitm): ring provider keeps the static musl build free of
# a C toolchain dependency beyond what the tree already needs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
webpki-roots = "1"
time = "0.3"
# Traffic browser (--mitm + --http-interface): passive HTTP parsing and exports
httparse = "1"
base64 = "0.22"
flate2 = "1"
brotli-decompressor = "5"

[dev-dependencies]
pem = "3"
tokio-test = "0.4"
reqwest = { version = "0.11", default-features = false, features = ["json"] }
serde_json = "1.0"

[[bench]]
name = "connection_cache_benchmark"
harness = false
